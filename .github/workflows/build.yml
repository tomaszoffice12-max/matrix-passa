name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      # 1. Tworzy pliki systemowe Androida
      - name: Create Android scaffolding
        run: flutter create . --org com.matrix.passa --project-name health_streak_app --platforms=android

      # 2. Dodaje wymagane biblioteki
      - name: Add required dependencies
        run: |
          flutter pub add health
          flutter pub add shared_preferences
          flutter pub add flutter_local_notifications

      # 3. Pobiera paczki
      - name: Install dependencies
        run: flutter pub get

      # 4. Buduje gotowy plik APK
      - name: Build Release APK
        run: flutter build apk --release

      # 5. Udostępnia plik APK do pobrania
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
